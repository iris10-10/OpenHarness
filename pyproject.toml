[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openharness-ai"
version = "0.2.0"
description = "Open-source Python port of Claude Code - an AI-powered CLI coding assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "novix-science" },
]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.80.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "mcp>=1.0.0,<2.0.0",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9.0",
    "questionary>=2.0.1",
    "watchfiles>=0.20.0",
    "croniter>=2.0.0",
    "slack-sdk>=3.0.0",
    "python-telegram-bot>=21.0.0",
    "discord.py>=2.0.0",
    "lark-oapi>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
#RAG 检索分组（Phase 1 启用）：向量库 + BM25 重排 + 文档解析，均为可选重依赖
rag = [
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]
#RAG 本地 Embedding 分组（BGE-M3 / sentence-transformers，体积大，按需安装）
rag-local = [
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
]
#Web UI 分组（Phase 6 启用）：求职仪表盘服务
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
openharness = "openharness.cli:app"
oh = "openharness.cli:app"
openh = "openharness.cli:app"
ohmo = "ohmo.cli:app"
oh-jobhunt = "openharness.jobhunt.cli:jobhunt_app"

[tool.hatch.build.targets.wheel]
packages = ["src/openharness", "ohmo"]

[tool.hatch.build]
exclude = [
    "/.git",
    "/.venv",
    "/.openharness-venv",
    "/.openharness",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/build",
    "/dist",
]

[tool.hatch.build.targets.wheel.force-include]
"frontend/terminal/package.json" = "openharness/_frontend/package.json"
"frontend/terminal/tsconfig.json" = "openharness/_frontend/tsconfig.json"
"frontend/terminal/src" = "openharness/_frontend/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
